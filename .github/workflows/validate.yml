name: Validate patcher

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Compile patcher
        run: python -m py_compile make_quieter_firmware.py
      - name: Validate patch payload
        run: python make_quieter_firmware.py --self-test
